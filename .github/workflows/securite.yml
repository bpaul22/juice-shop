name: Securite

on: [push, pull_request]

jobs:
  analyse-code:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (recherche de secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Semgrep (analyse du code)
        run: semgrep scan --config p/owasp-top-ten --sarif --output semgrep.sarif

      - name: Sauvegarder le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  artefact:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Hadolint (controle du Dockerfile)
        run: docker run --rm -i hadolint/hadolint:v2.12.0 /bin/hadolint --failure-threshold error - < Dockerfile

      - name: Construire l'image
        run: docker build -t juiceshop:1.0.0 .

      - name: Trivy image (rapport SARIF)
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v $PWD:/work aquasec/trivy:0.57.1 image --format sarif --output /work/trivy-image.sarif juiceshop:1.0.0

      - name: Trivy config (Dockerfile et manifestes)
        run: docker run --rm -v $PWD:/work aquasec/trivy:0.57.1 config --severity HIGH,CRITICAL /work

      - name: Syft (SBOM CycloneDX)
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v $PWD:/work anchore/syft:v1.18.1 juiceshop:1.0.0 -o cyclonedx-json=/work/sbom.cdx.json

      - name: Sauvegarder les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-artefact
          path: |
            trivy-image.sarif
            sbom.cdx.json

      - name: Trivy image (seuil bloquant CRITICAL)
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image --severity CRITICAL --ignore-unfixed --exit-code 1 juiceshop:1.0.0

  signature:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.digest.outputs.ref }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/bpaul22/juice-shop:1.0.0
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Connexion au registre GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Construire et pousser l'image
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Recuperer le digest de l'image
        id: digest
        run: |
          REF=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Image referencee par digest : $REF"

      - name: Generer le SBOM
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v $PWD:/work anchore/syft:v1.18.1 "$IMAGE" -o cyclonedx-json=/work/sbom.cdx.json

      - name: Signer l'image (Cosign sans cle)
        run: cosign sign --yes "${{ steps.digest.outputs.ref }}"

      - name: Attacher le SBOM en attestation
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${{ steps.digest.outputs.ref }}"

      - name: Verifier la signature
        run: cosign verify "${{ steps.digest.outputs.ref }}" --certificate-identity-regexp "https://github.com/bpaul22/juice-shop/.*" --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Verifier l'attestation du SBOM
        run: cosign verify-attestation "${{ steps.digest.outputs.ref }}" --type cyclonedx --certificate-identity-regexp "https://github.com/bpaul22/juice-shop/.*" --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

  kyverno:
    runs-on: ubuntu-latest
    needs: signature
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Creer le cluster kind
        run: kind create cluster --name devsecops

      - name: Installer Kyverno
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update
          helm install kyverno kyverno/kyverno -n kyverno --create-namespace
          kubectl wait --for=condition=Available deployment --all -n kyverno --timeout=300s

      - name: Appliquer les 3 politiques Kyverno
        run: |
          ok=0
          for i in $(seq 1 10); do
            if kubectl apply -f kyverno/politiques.yaml; then ok=1; break; fi
            echo "Le webhook Kyverno n'est pas encore pret, nouvel essai ($i/10) dans 15 s..."
            sleep 15
          done
          if [ "$ok" != "1" ]; then echo "Impossible d'appliquer les politiques"; exit 1; fi
          kubectl wait --for=condition=Ready clusterpolicy --all --timeout=180s
          kubectl get clusterpolicy

      - name: Test 1 - image non signee (refus attendu)
        run: |
          if OUT=$(kubectl run test-non-signee --image=nginx:1.27 --restart=Never 2>&1); then
            echo "$OUT"; echo "ERREUR : une image non signee aurait du etre refusee"; exit 1
          else
            echo "REFUS CONFIRME :"; echo "$OUT"
          fi

      - name: Test 2 - tag latest (refus attendu)
        run: |
          if OUT=$(kubectl run test-latest --image=nginx:latest --restart=Never 2>&1); then
            echo "$OUT"; echo "ERREUR : le tag latest aurait du etre refuse"; exit 1
          else
            echo "REFUS CONFIRME :"; echo "$OUT"
          fi

      - name: Test 3 - conteneur en root (refus attendu)
        run: |
          cat > pod-root.yaml <<EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: test-root
          spec:
            containers:
              - name: juiceshop
                image: ${{ needs.signature.outputs.ref }}
          EOF
          if OUT=$(kubectl apply -f pod-root.yaml 2>&1); then
            echo "$OUT"; echo "ERREUR : un conteneur en root aurait du etre refuse"; exit 1
          else
            echo "REFUS CONFIRME :"; echo "$OUT"
          fi

      - name: Test 4 - image signee et conforme (acceptation attendue)
        run: |
          cat > pod-conforme.yaml <<EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: juiceshop-conforme
          spec:
            containers:
              - name: juiceshop
                image: ${{ needs.signature.outputs.ref }}
                securityContext:
                  runAsNonRoot: true
          EOF
          kubectl apply -f pod-conforme.yaml
          kubectl get pod juiceshop-conforme

  zap:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Construire l'image de l'application
        run: docker build -t juiceshop:zap .

      - name: Demarrer l'application
        run: |
          docker run -d --name juiceshop -p 3000:3000 juiceshop:zap
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then echo "Application prete"; break; fi
            echo "Attente de l'application ($i)..."; sleep 5
          done

      - name: OWASP ZAP baseline
        run: |
          mkdir zap-out && chmod 777 zap-out
          docker run --rm --network host -v $PWD/zap-out:/zap/wrk:rw ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:3000 -r zap.html -J zap.json -I

      - name: Resume des alertes ZAP
        if: always()
        run: |
          python3 - <<'PY'
          import json, collections
          d = json.load(open('zap-out/zap.json'))
          c = collections.Counter()
          for site in d.get('site', []):
              for a in site.get('alerts', []):
                  c[a.get('riskdesc', '?').split(' ')[0]] += 1
          texte = "Alertes ZAP : " + ", ".join(k + " = " + str(v) for k, v in sorted(c.items()))
          print(texte)
          open('resume-zap.txt', 'w').write(texte + "\n")
          PY
          cat resume-zap.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Sauvegarder les rapports ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-rapport-${{ github.run_number }}
          path: |
            zap-out/zap.html
            zap-out/zap.json
            resume-zap.txt
